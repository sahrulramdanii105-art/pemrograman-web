
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Teknologi</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigasi -->
    <header>
        <nav class="navbar">
            <h1>Blog Teknologi</h1>

            <ul>
                <li><a href="#artikel">Artikel</a></li>
                <li><a href="#kontak">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <!-- Artikel -->
    <main>
        <section id="artikel" class="artikel">
            <h2>Mengenal Pemrograman Web</h2>
            <p>
                HTML, CSS, dan JavaScript adalah tiga fondasi
                dalam pengembangan web.
            </p>
        </section>

        <!-- Form Kontak -->
        <section id="kontak" class="kontak">
            <h2>Hubungi Kami</h2>

            <form id="formKontak">
                <input type="text" id="nama" placeholder="Nama">

                <input type="email" id="email" placeholder="Email">

                <textarea id="pesan" placeholder="Pesan"></textarea>

                <button type="submit">Kirim</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>Hak Cipta &copy; 2024</p>
    </footer>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>

</body>
</html>
